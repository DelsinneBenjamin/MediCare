<div class="flex min-h-screen flex-col justify-center bg-gray-50 px-4 py-8 sm:px-6 lg:px-8">
  <!-- Logo & Titre -->
  <div class="mx-auto w-full max-w-md text-center">
    <div class="mx-auto h-12 w-12 runded-full bg-teal-100 flex items-center justiofy-center">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-teal-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
      </svg>
    </div>
    <h2 class="mt-6 text-2xl font-bold text-gray-800">MediCare</h2>
    <p class="mt-2 text-sm text-gray-600">Veuillez vous identifier pour accéder à votre compte.</p>
  </div>

  <!-- Formulaire -->
  <div class="mt-8 mx-auto w-full max-w-md">
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6 bg-white p-6 rounded-xl shadow-md" novalidate>

      <!-- Email -->
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">Adresse e-mail</label>
        <div class="mt-1">
          <input
            type="email"
            id="email"
            formControlName="email"
            autocomplete="email"
            required
            class="block w-full rounded-lg border border-gray-300 px-4 py-2 text-gray-900 placeholder-gray-400 focus:ring-2 focus:ring-teal-500 focus:border-teal-500"
          />
        </div>
      </div>

      <!-- Mot de passe -->
      <div>
        <div class="flex items-center justify-between">
          <label for="password" class="block text-sm font-medium text-gray-700">Mot de passe</label>
          <a href="#" class="text-sm font-medium text-teal-600 hover:text-teal-500">Mot de passe oublié ?</a>
        </div>
        <div class="mt-1">
          <input
            type="password"
            id="password"
            formControlName="password"
            autocomplete="current-password"
            required
            class="block w-full rounded-lg border border-gray-300 px-4 py-2 text-gray-900 placeholder-gray-400 focus:ring-2 focus:ring-teal-500 focus:border-teal-500"
          />
        </div>
      </div>

      <!-- Erreur -->
      <div *ngIf="loginError" class="rounded-md bg-red-50 p-3 text-sm text-red-700 border border-red-200">
        {{ loginError }}
      </div>

      <!-- Bouton Connexion -->
      <div>
        <button type="submit"
          class="w-full flex justify-center py-2 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-teal-600 hover:bg-teal-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-teal-500 transition">
          Se connecter
        </button>
      </div>
    </form>
  </div>
</div>

<!-- État de connexion -->
<div class="mt-8 text-center">
  @if (isLoggedIn) {
    <p class="text-green-700 font-medium">Connecté</p>
  } @else {
    <p class="text-gray-500">Pas encore connecté</p>
  }
</div>
