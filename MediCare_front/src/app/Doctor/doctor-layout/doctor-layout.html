@if (currentUser(); as user) {
<div class="flex h-screen bg-gray-50">
  <!-- Barre latérale médicale -->
  <aside class="w-64 bg-gradient-to-b from-blue-800 to-blue-900 text-white p-4 flex flex-col h-full border-r border-blue-700/50">
    <div class="mb-8 flex items-center">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 mr-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 19a2 2 0 01-2-2V7a2 2 0 012-2h4l2 2h4a2 2 0 012 2v10a2 2 0 01-2 2h-4l-2-2H5z" />
      </svg>
      <h1 class="text-2xl font-bold tracking-tight">MediCare</h1>
    </div>

    <nav class="space-y-2">
      <a routerLink="/doctor/list-patient" routerLinkActive="active" class="flex items-center px-4 py-3 rounded-xl transition-all duration-200 hover:bg-blue-700/50 active:bg-blue-700">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-3 text-blue-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        </svg>
        <span class="font-medium">Liste des patients</span>
      </a>
      
      <a routerLink="/doctor/add-patient" routerLinkActive="active" class="flex items-center px-4 py-3 rounded-xl transition-all duration-200 hover:bg-blue-700/50 active:bg-blue-700">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-3 text-blue-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
        </svg>
        <span class="font-medium">Ajouter un patient</span>
      </a>
    </nav>

    <div class="mt-auto pt-6 border-t border-blue-700/30">
      <button type="button" class="w-full flex items-center px-4 py-3 rounded-xl bg-red-500 hover:bg-red-600 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
        <span class="font-medium" (click)="logout()" >Se déconnecter</span>
      </button>
    </div>
  </aside>
  
  <main class="flex-1 p-6 overflow-y-auto">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 h-full">
      <div class="p-6 border-b border-gray-200">
        <h2 class="text-2xl font-bold text-gray-800">Tableau de bord</h2>
        <p class="text-gray-600 mt-1">Bienvenue {{user.username}} - {{user.doctor?.speciality}} </p>
      </div>
      <div class="p-6">
        <router-outlet></router-outlet>
      </div>
    </div>
  </main>
</div>
} @else {
  <p>Chargement de vos données...</p>
}
