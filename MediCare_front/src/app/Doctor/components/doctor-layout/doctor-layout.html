@if (currentUser(); as user) {
<div class="flex h-screen bg-gray-50">

  <!-- Sidebar claire -->
  <aside class="w-64 bg-gradient-to-b from-blue-50 to-indigo-50 text-gray-800 p-5 flex flex-col h-full border-r border-indigo-100 rounded shadow-sm">

    <!-- Logo / Titre -->
    <div class="mb-8 flex items-center space-x-3">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 19a2 2 0 01-2-2V7a2 2 0 012-2h4l2 2h4a2 2 0 012 2v10a2 2 0 01-2 2h-4l-2-2H5z" />
      </svg>
      <h1 class="text-xl font-extrabold tracking-wide text-indigo-700">MediCare</h1>
    </div>

    <!-- Navigation -->
    <nav class="space-y-1.5 flex-1">

      <a routerLink="/doctor/profile" routerLinkActive="active"
        class="group flex items-center px-4 py-3 rounded-lg transition-all duration-200 hover:bg-indigo-100 active:bg-indigo-200 text-gray-700 hover:text-indigo-700">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-3 text-indigo-400 group-hover:text-indigo-600 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        </svg>
        <span class="font-medium">Mon Profil</span>
      </a>

      <a routerLink="/doctor/list-patient" routerLinkActive="active"
        class="group flex items-center px-4 py-3 rounded-lg transition-all duration-200 hover:bg-indigo-100 active:bg-indigo-200 text-gray-700 hover:text-indigo-700">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-3 text-indigo-400 group-hover:text-indigo-600 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        </svg>
        <span class="font-medium">Liste des patients</span>
      </a>

      <a
        class="group flex items-center px-4 py-3 rounded-lg transition-all duration-200 hover:bg-indigo-100 active:bg-indigo-200 text-gray-700 hover:text-indigo-700">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-3 text-indigo-400 group-hover:text-indigo-600 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        </svg>
        <span class="font-medium">Rendez-Vous</span>
      </a>

      <a
        class="group flex items-center px-4 py-3 rounded-lg transition-all duration-200 hover:bg-indigo-100 active:bg-indigo-200 text-gray-700 hover:text-indigo-700">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-3 text-indigo-400 group-hover:text-indigo-600 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        </svg>
        <span class="font-medium">Medicaments</span>
      </a>

    </nav>

    <!-- Déconnexion -->
    <div class="pt-6 mt-auto">
      <button type="button" (click)="logout()"
        class="w-full flex items-center justify-center px-4 py-2.5 rounded-lg bg-red-500 hover:bg-red-600 active:bg-red-700 text-white font-medium text-sm transition-colors shadow-sm hover:shadow">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
        Se déconnecter
      </button>
    </div>
  </aside>

  <!-- Main -->
  <main class="flex-1 p-6 overflow-y-auto">
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 h-full flex flex-col">

      <div class="p-6 border-b border-gray-100">
        <h2 class="text-xl font-bold text-gray-800">Tableau de bord</h2>
        <p class="text-gray-500 mt-1 text-sm">Bienvenue, <span class="font-medium text-indigo-600">{{user.username}}</span> — {{user.doctor?.speciality}}</p>
      </div>

      <div class="p-6 flex-1">
        <router-outlet></router-outlet>
      </div>
    </div>
  </main>
</div>
} @else {
  <div class="flex h-screen items-center justify-center bg-gray-50">
    <p class="text-gray-500 text-sm italic">Chargement de vos données...</p>
  </div>
}
