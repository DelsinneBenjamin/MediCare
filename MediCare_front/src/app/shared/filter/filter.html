<div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 p-4 bg-gray-50 rounded shadow">

  <!-- Dropdown -->
  <select
    [value]="filterField()"
    #fieldSelect
    class="px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
  >
    @for (option of filterOptions(); track option.value) {
      <option [value]="option.value">{{ option.label }}</option>
    } @empty {
      <option disabled>Aucune option disponible</option>
    }
  </select>

  <!-- Input texte -->
  <input
    type="text"
    [value]="filterValue()"
    #valueInput
    placeholder="Rechercher..."
    (keyup.enter)="onSearch(fieldSelect.value, valueInput.value)"
    class="flex-1 px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
  />

  <!-- Bouton recherche -->
  <button
    (click)="onSearch(fieldSelect.value, valueInput.value)"
    class="px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600"
  >
    Rechercher
  </button>

  <!-- Pagination -->
  <div class="flex gap-2">
    <button
      (click)="onPrev()"
      [disabled]="!hasPrev()"
      class="px-4 py-2 bg-blue-500 text-white rounded disabled:bg-gray-300"
    >
      Précédent
    </button>
    <button
      (click)="onNext()"
      [disabled]="!hasNext()"
      class="px-4 py-2 bg-blue-500 text-white rounded disabled:bg-gray-300"
    >
      Suivant
    </button>
  </div>

</div>
