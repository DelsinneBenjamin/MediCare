<div class="flex h-screen">
  <!-- Sidebar -->
  <div class="w-64 bg-gray-800 text-white flex flex-col">
    <!-- Logo / Titre -->
    <div class="p-4 text-xl font-bold border-b border-gray-700">
      Medicare
      <p>Bienvenue</p>
    </div>

    <!-- Liens -->
    <nav class="flex-1 p-4 space-y-2">
      <a  class="block px-4 py-2 rounded hover:bg-gray-700">🏠 Dashboard</a>
      <a  class="block px-4 py-2 rounded hover:bg-gray-700">📊 Statistiques</a>
      <a  class="block px-4 py-2 rounded hover:bg-gray-700">👥 Utilisateurs</a>
      <a  class="block px-4 py-2 rounded hover:bg-gray-700">⚙️ Paramètres</a>
    </nav>

    <!-- Bouton Déconnexion -->
    <div class="p-4 border-t border-gray-700">
      <button (click)="logout()" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
        Deconnexion
      </button>
    </div>
  </div>


 <div class="mt-4 p-4 bg-gray-50 border border-gray-200 rounded-lg shadow-sm">
  <h2 class="text-lg font-semibold text-gray-900 mb-2">Informations Utilisateur</h2>

  <p class="text-gray-700 mb-1">
    <span class="font-medium">Rôle :</span> {{ currentUser?.role }}
  </p>

  <p class="text-gray-700 mb-1">
    <span class="font-medium">username :</span> {{ currentUser?.username }}
  </p>

  <p class="text-gray-700 mb-1">
    <span class="font-medium">Email :</span> {{ currentUser?.email}}
  </p>
  <p class="text-gray-700">
    <span class="font-medium">Spécialité :</span> {{ currentUser?.doctor?.speciality}}
  </p>
</div>
