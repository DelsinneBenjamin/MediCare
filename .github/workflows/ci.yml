name: CI - Medicare

on:
  push:
    branches: ['main', 'develop']
  pull_request:
    branches: ['main', 'develop']

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          POSTGRES_DB: MediCare_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d MediCare_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: ./MediCare/MediCare_back

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django psycopg2-binary

      - name: Run backend tests
        env:
          DATABASE_URL: postgres://postgres:1234@localhost:5432/MediCare_db
        run: |
          python manage.py test -v2
